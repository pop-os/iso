# ZFSBootMenu dracut configuration
# This file configures dracut to build ZFSBootMenu images

# Add ZFSBootMenu module
add_dracutmodules+=" zfsbootmenu "

# Omit unnecessary modules to reduce image size
omit_dracutmodules+=" network nfs cifs iscsi "

# Install ZFSBootMenu configuration
install_optional_items+=" /etc/zfsbootmenu/config.yaml "

# Add firmware for hardware support
add_drivers+=" i915 nouveau amdgpu radeon "

# Hostonly mode (set to yes for smaller images)
# hostonly="no"

# Compression
compress="zstd"

# Optional: Add resume support for hibernation
# add_dracutmodules+=" resume "

# Optional: Add console fonts
# install_items+=" /usr/share/consolefonts/Lat2-Terminus16.psf.gz "
